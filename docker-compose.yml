services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      STOCK_AI_CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
